es":[[112.6605049,23.2122794],[112.6604163,23.2121893],[112.6604098,23.2120858]],"cls":"minor"}],"junctions":[[112.6473561,23.2104233],[112.6472811,23.210273],[112.6544092,23.2149255],[112.6535728,23.2153678],[112.6545797,23.21533],[112.6538607,23.2157151],[112.6537321,23.2155101],[112.6537496,23.2153118],[112.6542572,23.2150527],[112.6544676,23.2151362],[112.638392,23.2233871],[112.6384924,23.2235924],[112.6386478,23.2232493],[112.6387425,23.2234487],[112.6477381,23.2100267],[112.6478244,23.2101726],[112.6498676,23.2089069],[112.6499538,23.2090447],[112.6500161,23.2092296],[112.6497178,23.2087724],[112.6504619,23.2089426],[112.6501694,23.2090953],[112.6502144,23.2085525],[112.6499279,23.2087065],[112.6546786,23.2152773],[112.65027,23.2092625],[112.6479207,23.2187665],[112.6473121,23.2187929],[112.6475059,23.2189827],[112.6473667,23.2187661],[112.6478671,23.2187948],[112.6477379,23.2185838],[112.6512197,23.2168252],[112.6513374,23.2170239],[112.6516839,23.2165871],[112.6518008,23.2167846],[112.6423671,23.2211729],[112.6423537,23.2213725],[112.6425121,23.221105],[112.6424428,23.221571],[112.6426915,23.2211984],[112.6427843,23.2214004],[112.6422315,23.2211983],[112.6426687,23.2209847],[112.6428381,23.2213735],[112.6422954,23.2214025],[112.6424823,23.2210487],[112.638816,23.2234065],[112.6383167,23.2234277],[112.6506576,23.208879],[112.6503606,23.2084083],[112.6515148,23.2165052],[112.6517555,23.2169229],[112.6512327,23.2166464],[112.6514746,23.2170635],[112.6519072,23.2168964],[112.6428963,23.2215191],[112.6427541,23.2215628],[112.6426134,23.2216374],[112.6424722,23.2217533],[112.6504167,23.2085926],[112.6505022,23.2087341],[112.6505489,23.2087101],[112.649826,23.2089314],[112.6501714,23.2084836],[112.6536977,23.2155275],[112.6542314,23.2150079],[112.6556955,23.2149193],[112.6551828,23.2151872],[112.6558919,23.2148213]]}};
const L = DATA.layers || {};
let coords, cum, total, man;
const rad = Math.PI/180;
function distM(a,b){
  const dx=(b[0]-a[0])*rad*Math.cos((a[1]+b[1])/2*rad), dy=(b[1]-a[1])*rad;
  return Math.sqrt(dx*dx+dy*dy)*6371000;
}
function computeCum(){ cum=[0]; for(let i=1;i<coords.length;i++) cum.push(cum[i-1]+distM(coords[i-1],coords[i])); }
function bearing(a,b){
  const dx=(b[0]-a[0])*rad*Math.cos((a[1]+b[1])/2*rad), dy=(b[1]-a[1])*rad;
  return (Math.atan2(dx,dy)/rad+360)%360;
}
function posAt(d){
  d=Math.max(0,Math.min(total,d));
  let i=1; while(i<cum.length-1 && cum[i]<d) i++;
  const a=coords[i-1], b=coords[i];
  const segLen=(cum[i]-cum[i-1])||1e-9, t=(d-cum[i-1])/segLen;
  return {lng:a[0]+(b[0]-a[0])*t, lat:a[1]+(b[1]-a[1])*t, heading:bearing(a,b)};
}
function segsGeoJSON(){
  const defs=[[0,.4,'#16a34a'],[.4,.65,'#84cc16'],[.65,.85,'#f59e0b'],[.85,1,'#dc2626']];
  const feats=[];
  for(const [f0,f1,color] of defs){
    const d0=total*f0, d1=total*f1, line=[];
    const p0=posAt(d0); line.push([p0.lng,p0.lat]);
    for(let i=0;i<coords.length;i++){ if(cum[i]>d0 && cum[i]<d1) line.push(coords[i]); }
    const p1=posAt(d1); line.push([p1.lng,p1.lat]);
    feats.push({type:'Feature',properties:{color},geometry:{type:'LineString',coordinates:line}});
  }
  return {type:'FeatureCollection',features:feats};
}
function fc(arr){ return {type:'FeatureCollection',features:arr.map(c=>({type:'Feature',geometry:{type:'LineString',coordinates:c}}))}; }
function fcPts(arr){ return {type:'FeatureCollection',features:arr.map(c=>({type:'Feature',geometry:{type:'Point',coordinates:c}}))}; }

const map = new maplibregl.Map({
  container:'map',
  style: 'https://tiles.openfreemap.org/styles/liberty',
  center:DATA.coords[0], zoom:15.5, pitch:55, bearing:bearing(DATA.coords[0],DATA.coords[1])
});
map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'bottom-right');

const el=document.createElement('div');
el.innerHTML='<svg width="42" height="42" viewBox="0 0 40 40"><rect x="11" y="4" width="18" height="32" rx="6" fill="#1d4ed8" stroke="#ffffff" stroke-width="2.5"/><rect x="14.5" y="10" width="11" height="6.5" rx="2" fill="#93c5fd"/></svg>';
const marker=new maplibregl.Marker({element:el, rotationAlignment:'map', pitchAlignment:'map'}).setLngLat(DATA.coords[0]).addTo(map);

let follow=true, playing=true, speed=20, dCur=0, last=performance.now(), arrived=false;
const $=id=>document.getElementById(id);
coords=DATA.coords.slice(); man=DATA.maneuvers.slice(); total=DATA.total; computeCum();

function rebuildRoute(){
  for(const id of ['route','routeCasing']) if(map.getLayer(id)){ map.removeLayer(id); map.removeSource(id); }
  map.addSource('routeCasing',{type:'geojson',data:segsGeoJSON()});
  map.addLayer({id:'routeCasing',type:'line',source:'routeCasing',paint:{'line-color':'#ffffff','line-width':11,'line-opacity':.95}});
  map.addSource('route',{type:'geojson',data:segsGeoJSON()});
  map.addLayer({id:'route',type:'line',source:'route',paint:{'line-color':['get','color'],'line-width':6.5,'line-opacity':.97}});
}
function resetAnim(){ dCur=0; arrived=false; playing=true; $('btn-play').textContent='暂停'; }

function iconFor(type,modifier){
  const S='fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"';
  let p;
  if(type==='depart') p='<circle cx="20" cy="20" r="6" fill="#fff"/>';
  else if(type==='arrive') p=`<path d="M14 33 V7 M14 8 H28 L23 13 L28 18 H14" ${S}/>`;
  else if(modifier==='left') p=`<path d="M26 33 V21 Q26 15 20 15 H12 M17 9 L11 15 L17 21" ${S}/>`;
  else if(modifier==='right') p=`<path d="M14 33 V21 Q14 15 20 15 H28 M23 9 L29 15 L23 21" ${S}/>`;
  else if(modifier==='slight left') p=`<path d="M24 33 V22 L13 11 M12 19 L12 11 L20 10" ${S}/>`;
  else if(modifier==='slight right') p=`<path d="M16 33 V22 L27 11 M28 19 L28 11 L20 10" ${S}/>`;
  else if(modifier==='uturn') p=`<path d="M13 33 V15 Q13 8 20 8 Q27 8 27 15 V22 M22 17 L27 23 L32 17" ${S}/>`;
  else p=`<path d="M20 33 V9 M13 16 L20 9 L27 16" ${S}/>`;
  return `<svg viewBox="0 0 40 40">${p}</svg>`;
}
function fmtDist(m){ return m>=950 ? [(m/1000).toFixed(1),'km'] : [String(Math.round(m/10)*10),'m']; }
function updateCard(d){
  const next=man.find(m=>m.d>d+0.5);
  if(!next){
    if(!arrived){ arrived=true; playing=false; $('btn-play').textContent='重新播放'; }
    $('turn-icon').innerHTML=iconFor('arrive',''); $('turn-dist').textContent='到达'; $('turn-unit').textContent='';
    $('turn-road').textContent='肇庆东站 · 站前落客区'; $('road-label').textContent='已到达目的地';
    return;
  }
  const [v,u]=fmtDist(next.d-d);
  $('turn-icon').innerHTML=iconFor(next.type,next.modifier);
  $('turn-dist').textContent=v; $('turn-unit').textContent=u;
  $('turn-road').textContent=next.name ? '进入 '+next.name : '继续前行';
  let cur=null; for(const m of man){ if(m.d<=d+0.5 && m.name) cur=m; }
  $('road-label').textContent=cur ? '当前：'+cur.name : '行驶中';
}
function frame(now){
  const dt=Math.min((now-last)/1000,0.1); last=now;
  if(playing) dCur=Math.min(dCur+speed*dt,total);
  const p=posAt(dCur);
  marker.setLngLat([p.lng,p.lat]).setRotation(p.heading);
  if(follow) map.jumpTo({center:[p.lng,p.lat], bearing:p.heading, pitch:55});
  updateCard(dCur);
  requestAnimationFrame(frame);
}

function addMapLayers(){
  if(L.green && L.green.length){
    map.addSource('green',{type:'geojson',data:fc(L.green)});
    map.addLayer({id:'green',type:'fill',source:'green',paint:{'fill-color':'#6fbf4f','fill-opacity':.5}});
  }
  if(L.water && L.water.length){
    map.addSource('water',{type:'geojson',data:fc(L.water)});
    map.addLayer({id:'water',type:'line',source:'water',paint:{'line-color':'#6cb4e6','line-width':1.6,'line-opacity':.85}});
  }
  if(L.junctions && L.junctions.length){
    map.addSource('junction',{type:'geojson',data:fcPts(L.junctions)});
    map.addLayer({id:'junction',type:'circle',source:'junction',paint:{'circle-radius':3.5,'circle-color':'#1d4ed8','circle-stroke-color':'#fff','circle-stroke-width':1.5}});
  }
}
function addPOI(lng,lat,text,cls){
  const d=document.createElement('div'); d.className='poi'+(cls?' '+cls:''); d.textContent=text;
  new maplibregl.Marker({element:d}).setLngLat([lng,lat]).addTo(map);
}
const POIS=[
  [112.6578,23.2167,'肇庆东站',null],
  [112.6572,23.2152,'站前落客区',null],
  [112.6605,23.2138,'停车场','green'],
  [112.6553,23.2168,'D 出站口','green']
];

let drawMode=false, drawPts=[], drawMarkers=[];
function setHint(txt){ $('hint').style.display=txt?'block':'none'; $('hint').textContent=txt; }
function updateDrawLine(){
  if(map.getSource('drawTemp')) map.getSource('drawTemp').setData({type:'Feature',geometry:{type:'LineString',coordinates:drawPts.map(p=>[p.lng,p.lat])}});
}
function clearDraw(){
  drawPts=[]; drawMarkers.forEach(m=>m.remove()); drawMarkers=[]; updateDrawLine();
  setHint(''); $('btn-draw').classList.remove('active'); drawMode=false;
}
$('btn-draw').onclick=()=>{
  drawMode=!drawMode; $('btn-draw').classList.toggle('active',drawMode);
  follow=false; $('btn-follow').classList.remove('active');
  setHint(drawMode? '绘制中：在地图上依次点击添加途经点，至少 2 个' : '');
};
$('btn-clear').onclick=()=>clearDraw();
map.on('click',e=>{
  if(!drawMode) return;
  drawPts.push(e.lngLat);
  const m=new maplibregl.Marker({color:'#2563eb'}).setLngLat(e.lngLat).addTo(map);
  drawMarkers.push(m); updateDrawLine();
  setHint('已添加 '+drawPts.length+' 个点'+(drawPts.length>=2?'，点「✓生成路线」生成道路路线':'，继续点击'));
});
$('btn-gen').onclick=async()=>{
  if(drawPts.length<2){ setHint('至少点击 2 个点'); return; }
  setHint('正在规划真实道路路线…');
  const c=drawPts.map(p=>p.lng.toFixed(5)+','+p.lat.toFixed(5)).join(';');
  const url='https://router.project-osrm.org/route/v1/driving/'+c+'?overview=full&geometries=geojson&steps=true';
  try{
    const r=await fetch(url); const j=await r.json();
    if(j.code!=='Ok'||!j.routes.length){ setHint('规划失败：两点之间可能无道路连通'); return; }
    const rt=j.routes[0];
    coords=rt.geometry.coordinates.map(c=>[round5(c[0]),round5(c[1])]);
    total=Math.round(rt.distance); man=[];
    for(const leg of rt.legs) for(const s of leg['steps']){
      const loc=s.maneuver.location; let best=0,bd=1e18;
      for(let i=0;i<coords.length;i++){ const dd=distM(coords[i],loc); if(dd<bd){bd=dd;best=i;} }
      man.push({d:Math.round(cum?cum[best]:0),type:s.maneuver.type,modifier:s.maneuver.modifier||'',name:s.name||''});
    }
    computeCum(); man[0].d=0; man[man.length-1].d=Math.round(total);
    clearDraw(); rebuildRoute(); resetAnim();
    follow=true; $('btn-follow').classList.add('active'); setHint('');
  }catch(err){ setHint('请求出错：'+err.message); }
};
function round5(x){ return Math.round(x*1e5)/1e5; }

map.on('load',()=>{
  addMapLayers();
  for(const p of POIS) addPOI(p[0],p[1],p[3]?p[2]:p[2],p[3]);
  map.addSource('drawTemp',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:[]}}});
  map.addLayer({id:'drawTemp',type:'line',source:'drawTemp',paint:{'line-color':'#2563eb','line-width':3,'line-dasharray':[2,2]}});
  rebuildRoute();
  requestAnimationFrame(t=>{last=t;frame(t);});
});
map.on('dragstart',()=>{ follow=false; $('btn-follow').classList.remove('active'); });
$('btn-follow').onclick=()=>{ follow=true; $('btn-follow').classList.add('active'); };
$('btn-overview').onclick=()=>{
  follow=false; $('btn-follow').classList.remove('active');
  const xs=coords.map(c=>c[0]), ys=coords.map(c=>c[1]);
  map.fitBounds([[Math.min(...xs),Math.min(...ys)],[Math.max(...xs),Math.max(...ys)]],{padding:90,pitch:0,bearing:0,duration:900});
};
$('btn-play').onclick=()=>{
  if(arrived){ arrived=false; dCur=0; playing=true; $('btn-play').textContent='暂停'; return; }
  playing=!playing; $('btn-play').textContent=playing?'暂停':'继续';
};
$('speed').onchange=e=>{ speed=parseInt(e.target.value); };
</script>
