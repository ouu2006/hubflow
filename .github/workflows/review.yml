name: 自动审查

# 每次有新提交就审查：
#   · opened / synchronize / reopened  → PR 新建、有新提交、重新打开
#   · ready_for_review                 → 草稿转正式
#   · workflow_dispatch                → 手动触发（调试用）
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:

# 同一个 PR 连续推送时取消上一轮未跑完的审查（省额度）
concurrency:
  group: review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read          # 读代码
  pull-requests: write    # 发/更新评论

jobs:
  review:
    name: 静态门禁 + AI 审查
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 取代码（含基线分支，供 diff 比较）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 准备基线
        run: |
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/origin/pr-head" || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # review.py 自己会：① 跑静态门禁 ② 调 AI（若配了密钥）③ 回帖到 PR
      # 有 FAIL 时它先回帖、再以退出码 1 结束 → 本步骤失败 → PR 被挡住
      - name: 审查并回帖
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AI_REVIEW_API_KEY: ${{ secrets.AI_REVIEW_API_KEY }}
          AI_REVIEW_BASE_URL: ${{ vars.AI_REVIEW_BASE_URL }}
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL }}
        run: |
          BASE="origin/main"
          if git rev-parse --verify origin/pr-head >/dev/null 2>&1; then
            HEAD_REF="origin/pr-head"
          else
            HEAD_REF="HEAD"
          fi
          python tools/ci/review.py \
            --base "$BASE" \
            --head "$HEAD_REF" \
            --branch "${{ github.head_ref || github.ref_name }}" \
            --post "${{ github.event.pull_request.number }}" \
            --out review-report.md

      - name: 上传审查报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-report
          path: review-report.md
          if-no-files-found: ignore
