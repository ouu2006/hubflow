name: CI

# 本仓库的门禁（口径见 docs/协作规范.md 第 4 节、docs/开发规范.md 第 11 节、
# docs/填表报告.md 第 4 节）：
#   * 本地与 CI 跑的是**同一条命令**：`python scripts/doc_gate.py` —— 避免"本地绿、CI 红"；
#   * 检查名固定为 **`ci`**：`main` 分支保护里要 require 的就是这个名字（见 docs/仓库设置清单.md）；
#   * 现在仓库里只有文档与配置，所以只有一个 job。等第一批代码（`work/**`）落地后，
#     在下面按目录追加 job（或按改动范围裁剪），**不要改 `ci` 这个 job 名**，否则分支保护会失配。

on:
  pull_request:
  push:
    branches: [main]
  # 手动触发的语义是"我不确定，全都跑一遍"。取不到改动清单时门禁只打 [注意]、不误判。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 门禁第 7 组（填表报告台账）要查"某产物最近一次改动的提交是哪天"，
          # 浅克隆没有历史 → 那一项会静默失效。取全历史，代价只有几秒。
          fetch-depth: 0

      # 门禁第 7 组还要知道"本次提交改了什么"：本地它读 `git diff HEAD`，
      # 而 CI checkout 出来的是一份快照，必须显式告诉它。
      # 约定：**清单文件存在 = 清单已知**（空文件 = 本次没改任何文件）；
      #       **文件不存在 = 不知道改了什么** → 门禁打 [注意]，只做格式校验，不误判成"什么都没改"。
      #
      # PR：与目标分支比。
      - name: 取本次改动清单（PR）
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          LIST="$RUNNER_TEMP/changed.txt"
          rm -f "$LIST"
          git fetch --no-tags --depth=1 origin "$BASE_REF" >/dev/null 2>&1 || true
          if git diff --name-only "origin/$BASE_REF"...HEAD > "$LIST"; then
            echo "本次改动 $(wc -l < "$LIST") 个文件"
          else
            rm -f "$LIST"
            echo "::warning::取不到与 $BASE_REF 的 diff，第 7 组只做格式校验"
          fi

      # push 到 main：与上一个提交比。
      - name: 取本次改动清单（push）
        if: github.event_name == 'push'
        run: |
          LIST="$RUNNER_TEMP/changed.txt"
          rm -f "$LIST"
          git diff --name-only HEAD~1...HEAD > "$LIST" \
            || { rm -f "$LIST"; echo "::warning::取不到 HEAD~1 的 diff，第 7 组只做格式校验"; }

      # 不装 setup-python：ubuntu-latest 自带 python3，少一个版本变量。
      - name: 文档与契约门禁
        env:
          # ⚠️ 必须挂在**步骤级**：`runner` 上下文在工作流级 `env` 里不可用（会展开成空串，
          # 第 7 组就退化成只查格式）。写死 `$RUNNER_TEMP` 的路径与上面两步一致。
          DOC_GATE_CHANGED_FILE: ${{ runner.temp }}/changed.txt
        run: python3 scripts/doc_gate.py

      # 以后加代码时，把这几步加进来（与 README 的最小启动路径同一口径）：
      #   - name: 依赖
      #     run: pip install -r requirements.txt
      #   - name: 模块自跑（--sample）
      #     run: python work/<目录>/run.py --sample
